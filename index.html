<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manhwa Tracker</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7B5CF0">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Manhwa Tracker">
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['"Bricolage Grotesque"','system-ui','sans-serif']},colors:{ink:'#1F1B3A',paper:'var(--bg)',night:'var(--bg)',plum:'rgb(var(--accent) / <alpha-value>)'}}}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
body{overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
@media(max-width:640px){header button:not([aria-label="My profile"]){padding:.4rem .85rem;font-size:.85rem}}
:root{--accent:123 92 240;--bg:#F3F1F7}.dark{--bg:#14121F}body{background-color:var(--bg);background-attachment:fixed;color:#1F1B3A;transition:background-color .3s}.dark body{color:#EDEAF7}
.drawer{animation:slide .28s cubic-bezier(.2,.8,.2,1)}@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.pop{animation:pop .2s ease-out}@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.drawer,.pop{animation:none}}
.inp{width:100%;border-radius:.75rem;padding:.55rem .8rem;background:rgb(var(--accent)/.07);border:1px solid rgb(var(--accent)/.2);outline:none}
.inp:focus{border-color:rgb(var(--accent));box-shadow:0 0 0 3px rgb(var(--accent)/.25)}
</style>
</head>
<body class="font-sans antialiased"><div id="root"></div>
<script type="text/babel" data-presets="react">
/* Your Supabase keys now live in config.js */
const SUPABASE_URL = (window.APP_CONFIG||{}).url || "PASTE_YOUR_PROJECT_URL";
const SUPABASE_ANON_KEY = (window.APP_CONFIG||{}).key || "PASTE_YOUR_ANON_PUBLIC_KEY";
/* ========================================================== */
const {useState,useEffect,useMemo,useRef}=React;
const configured=!SUPABASE_URL.startsWith("PASTE");
const sb=configured?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
const STATUS=[["reading","Reading"],["want","Want to Read"],["hiatus","Read on Hiatus"],["dropped","Dropped"],["done","Completed"]];
const FORMATS=["Manhwa","Manga","Manhua"];
const PUB=["Ongoing","Completed","On hiatus","Permanent hiatus","Discontinued","Not yet released"];
const TABS=STATUS;
const STAT=Object.fromEntries(STATUS);
const norm=t=>(t||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const same=(a,b)=>(a.anilist_id&&a.anilist_id===b.anilist_id)||(norm(a.title)!==""&&norm(a.title)===norm(b.title));
const relWith=(rows,me,uid)=>{const f=rows.find(r=>(r.requester===me&&r.addressee===uid)||(r.addressee===me&&r.requester===uid));return f?{...f,dir:f.requester===me?"out":"in"}:null};
async function addFriend(me,uid,rows){const ex=relWith(rows,me,uid);
  if(ex&&ex.dir==="in"&&ex.status==="pending")return await sb.from("friendships").update({status:"accepted"}).eq("id",ex.id);
  if(ex)return {};
  return await sb.from("friendships").insert({addressee:uid})}
const PRESETS={Lavender:["#7B5CF0","#F3F1F7","#14121F"],Sakura:["#EC4899","#FDF1F5","#1F121A"],Matcha:["#22A06B","#EEF6F0","#101A15"],Ocean:["#0E87DC","#EEF5FA","#0F1823"],Peach:["#F4723C","#FFF3EA","#1E1511"]};
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)).join(" ");
function applyTheme(t,dark){const p=PRESETS[t.preset]||PRESETS.Lavender,a=t.accent||p[0],s=document.documentElement.style;
  s.setProperty("--accent",rgb(a));s.setProperty("--bg",dark?p[2]:p[1]);
  document.body.style.backgroundImage=t.grad?`radial-gradient(circle at 8% 0%,${a}38,transparent 42%),radial-gradient(circle at 100% 15%,${a}26,transparent 38%)`:"none"}
const arr=s=>(s||"").split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
const blank={title:"",cover_url:"",format:"Manhwa",genres:[],synopsis:"",status:"want",excitement:0,priority:false,source:"",media:[],tags:[],warnings:"",notes:"",rating:null,review:"",pub_status:""};
const isImg=u=>/\.(png|jpe?g|gif|webp|avif)(\?|$)/i.test(u)||/pinimg|googleusercontent|gstatic/.test(u);

async function searchAniList(q){
  const query=`query($s:String){Page(perPage:8){media(search:$s,type:MANGA,sort:SEARCH_MATCH){id title{romaji english} coverImage{large} countryOfOrigin genres tags{name isMediaSpoiler} description(asHtml:false) status}}}`;
  const r=await fetch("https://graphql.anilist.co",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query,variables:{s:q}})});
  return (await r.json()).data.Page.media.map(m=>({
    anilist_id:m.id,pub_status:{FINISHED:"Completed",RELEASING:"Ongoing",NOT_YET_RELEASED:"Not yet released",CANCELLED:"Discontinued",HIATUS:"On hiatus"}[m.status]||"",title:m.title.english||m.title.romaji,cover_url:m.coverImage.large,
    format:m.countryOfOrigin==="KR"?"Manhwa":["CN","TW","HK"].includes(m.countryOfOrigin)?"Manhua":"Manga",
    genres:[...m.genres,...m.tags.filter(t=>!t.isMediaSpoiler).slice(0,5).map(t=>t.name)],
    synopsis:(m.description||"").replace(/<[^>]+>/g," ").replace(/\(Source:.*?\)/gi,"").replace(/\s+/g," ").trim().slice(0,520).replace(/^(.{200,}[.!?])\s[^.!?]*$/,"$1")
  }));
}

function Stars({v,on,size="text-xl"}){return <span className={size}>{[1,2,3,4,5].map(n=>
  <button key={n} type="button" disabled={!on} onClick={()=>on(v===n?0:n)} className={(n<=v?"text-amber-400":"text-stone-400/50")+" transition hover:scale-110"} aria-label={n+" hype"}>♥</button>)}</span>}

function Logo({size=44}){return <svg width={size} height={size} viewBox="0 0 48 48" aria-label="Manhwa Tracker logo">
  <rect width="48" height="48" rx="14" className="fill-plum"/>
  <path d="M9 19c5-2.5 10-2 15 1.5v17c-5-3-10-3.5-15-1.5z" fill="#fff"/><path d="M39 19c-5-2.5-10-2-15 1.5v17c5-3 10-3.5 15-1.5z" fill="#fff" opacity=".88"/>
  <path d="M13 24c3-1 6-.5 8 1M13 29c3-1 6-.5 8 1M27 25c2-1.500 5-2 8-1M27 30c2-1.500 5-2 8-1" stroke="currentColor" className="text-plum" strokeWidth="1.600" strokeLinecap="round" fill="none" opacity=".45"/>
  <path d="M24 17c-1.500-3-6-2.200-6 1.200 0 2.200 2.800 3.800 6 6.300 3.200-2.500 6-4.100 6-6.300 0-3.400-4.500-4.200-6-1.200z" fill="#FFB3D1" stroke="#fff" strokeWidth="1.500"/>
  <circle cx="38" cy="10" r="1.800" fill="#fff"/><circle cx="10" cy="11" r="1.200" fill="#fff" opacity=".8"/></svg>}

function ThemePanel({th,dark,setDark,onClose}){const {t,setT}=th;const acc=t.accent||PRESETS[t.preset][0];
  const Row=({label,children})=><label className="flex items-center justify-between font-semibold">{label}{children}</label>;
  return <div className="fixed inset-0 z-50 flex justify-end bg-black/40" onClick={onClose}><div className="drawer w-full max-w-sm h-full bg-paper p-6 space-y-5 overflow-y-auto" onClick={e=>e.stopPropagation()}>
    <div className="flex justify-between items-center"><h2 className="text-2xl font-extrabold">Make it yours</h2><button onClick={onClose} className="text-2xl px-2" aria-label="Close">×</button></div>
    <div><p className="font-semibold mb-2">Theme</p><div className="grid grid-cols-5 gap-2">{Object.entries(PRESETS).map(([n,p])=><button key={n} onClick={()=>setT({...t,preset:n,accent:null})} className={"rounded-2xl p-1 text-xs font-bold "+(t.preset===n&&!t.accent?"ring-2 ring-plum":"")}><span className="block h-10 rounded-xl mb-1" style={{background:`linear-gradient(135deg,${p[0]},${p[1]})`}}/>{n}</button>)}</div></div>
    <Row label="Custom accent color"><input type="color" value={acc} onChange={e=>setT({...t,accent:e.target.value})} className="h-10 w-16 rounded-lg bg-transparent cursor-pointer"/></Row>
    <Row label="Soft color glow background"><input type="checkbox" checked={!!t.grad} onChange={e=>setT({...t,grad:e.target.checked})} className="h-5 w-5 accent-plum"/></Row>
    <Row label="Dark mode"><input type="checkbox" checked={dark} onChange={()=>setDark(!dark)} className="h-5 w-5 accent-plum"/></Row>
    <button onClick={()=>setT({preset:"Lavender",grad:true})} className="text-sm underline opacity-70">Reset to default look</button></div></div>}

function Avatar({url,name,size=40}){return url?<img src={url} alt="" style={{width:size,height:size}} className="rounded-full object-cover"/>:<span style={{width:size,height:size,fontSize:size/2.2}} className="rounded-full bg-plum text-white font-extrabold grid place-items-center">{(name||"?").slice(0,1).toUpperCase()}</span>}
function resizeImg(file){return new Promise((ok,no)=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),n=256,m=Math.min(img.width,img.height);c.width=c.height=n;c.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,n,n);ok(c.toDataURL("image/jpeg",.85))};img.onerror=no;img.src=URL.createObjectURL(file)})}

function ProfilePanel({user,prof,items,onSave,onClose}){
  const [name,setName]=useState(prof.display_name||""),[bio,setBio]=useState(prof.bio||""),[av,setAv]=useState(prof.avatar_url||""),fr=useRef();
  const pick=async e=>{const f=e.target.files[0];if(f)try{setAv(await resizeImg(f))}catch(x){alert("That image could not be read. Try a JPG or PNG.")}};
  const n=k=>items.filter(i=>i.status===k).length;
  return <div className="fixed inset-0 z-50 flex justify-end bg-black/40" onClick={onClose}><div className="drawer w-full max-w-sm h-full bg-paper p-6 space-y-5 overflow-y-auto" onClick={e=>e.stopPropagation()}>
    <div className="flex justify-between items-center"><h2 className="text-2xl font-extrabold">My profile</h2><button onClick={onClose} className="text-2xl px-2" aria-label="Close">×</button></div>
    <div className="flex flex-col items-center gap-3"><Avatar url={av} name={name||user.email} size={112}/>
      <div className="flex gap-2"><button onClick={()=>fr.current.click()} className="rounded-full bg-plum/15 font-bold px-4 py-1.5 text-sm">Upload photo</button>{av&&<button onClick={()=>setAv("")} className="rounded-full px-4 py-1.5 text-sm underline opacity-70">Remove</button>}</div>
      <input ref={fr} type="file" accept="image/*" hidden onChange={pick}/></div>
    <label className="block"><span className="text-sm font-semibold opacity-70">Display name</span><input className="inp" value={name} maxLength={40} onChange={e=>setName(e.target.value)} placeholder="What should friends call you?"/></label>
    <label className="block"><span className="text-sm font-semibold opacity-70">About me</span><textarea className="inp" rows={3} maxLength={200} value={bio} onChange={e=>setBio(e.target.value)} placeholder="Favorite genres, tropes, anything"/></label>
    <div className="grid grid-cols-4 gap-2 text-center">{[["Reading",n("reading")],["Want to read",n("want")],["On hiatus",n("hiatus")],["Completed",n("done")]].map(([l,v])=><div key={l} className="rounded-2xl bg-plum/10 p-3"><p className="text-2xl font-extrabold">{v}</p><p className="text-xs opacity-70">{l}</p></div>)}</div>
    <p className="text-sm opacity-60">Signed in as {user.email}</p>
    <button onClick={()=>onSave({display_name:name.trim()||null,bio:bio.trim()||null,avatar_url:av||null})} className="w-full rounded-xl bg-plum text-white font-bold py-2.5 hover:brightness-110">Save profile</button></div></div>}

function Setup(){return <div className="min-h-screen grid place-items-center p-6"><div className="max-w-md rounded-3xl bg-white/70 dark:bg-white/5 p-8 pop">
  <h1 className="text-3xl font-extrabold">Almost there</h1><p className="mt-3 opacity-80">Add a file named <code>config.js</code> next to index.html containing your Supabase Project URL and anon key, then reload.</p></div></div>}

function Auth(){
  const [email,setE]=useState(""),[pw,setP]=useState(""),[mode,setM]=useState("in"),[msg,setMsg]=useState("");
  const go=async e=>{e.preventDefault();setMsg("");
    const {error,data}=mode==="in"?await sb.auth.signInWithPassword({email,password:pw}):await sb.auth.signUp({email,password:pw});
    if(error)setMsg(error.message);else if(mode==="up"&&!data.session)setMsg("Check your email to confirm your account, then sign in.")};
  return <div className="min-h-screen grid place-items-center p-6"><form onSubmit={go} className="w-full max-w-sm rounded-3xl bg-white/70 dark:bg-white/5 p-8 space-y-4 pop">
    <div className="flex items-center gap-3"><Logo size={48}/><h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight">Manhwa Tracker</h1></div><p className="opacity-70">Your queue of manhwa, manga and manhua, saved to your account.</p>
    <input className="inp" type="email" placeholder="Email" value={email} onChange={e=>setE(e.target.value)} required/>
    <input className="inp" type="password" placeholder="Password (6+ characters)" value={pw} onChange={e=>setP(e.target.value)} minLength={6} required/>
    {msg&&<p className="text-sm text-rose-500">{msg}</p>}
    <button className="w-full rounded-xl bg-plum text-white font-bold py-2.5 hover:brightness-110">{mode==="in"?"Sign in":"Create account"}</button>
    <button type="button" className="text-sm underline opacity-70" onClick={()=>setM(mode==="in"?"up":"in")}>{mode==="in"?"New here? Create an account":"Have an account? Sign in"}</button>
  </form></div>}

function Card({s,onOpen,drag,readOnly,fr}){
  return <article draggable={!readOnly&&!!drag} {...(drag||{})} onClick={()=>onOpen(s)} className={"group cursor-pointer rounded-2xl overflow-hidden bg-white dark:bg-white/5 transition hover:-translate-y-1 "+(s.priority?"ring-2 ring-amber-400 shadow-[0_8px_30px_rgba(242,179,61,.3)]":"shadow-sm hover:shadow-lg")}>
    <div className="relative aspect-[2/3] bg-plum/10">
      {s.cover_url?<img src={s.cover_url} alt="" loading="lazy" className="w-full h-full object-cover"/>:<div className="h-full grid place-items-center p-4 text-center font-bold opacity-60">{s.title}</div>}
      <span className="absolute top-2 left-2 text-xs font-bold rounded-full px-2 py-0.5 bg-black/60 text-white">{s.format}</span>
      {s.priority&&<span className="absolute top-2 right-2 rounded-full bg-amber-400 text-black text-xs font-bold px-2 py-0.5">★ Top pick</span>}
    </div>
    <div className="p-3"><h3 className="font-bold leading-tight line-clamp-2">{s.title}</h3>
      {s.pub_status&&<p className="text-xs opacity-60">{s.pub_status}</p>}
      <div className="mt-1 flex items-center justify-between"><Stars v={s.excitement} size="text-sm"/>{["done","hiatus","dropped"].includes(s.status)&&s.rating!=null&&<span className="text-sm font-bold text-plum">{s.rating}/10</span>}</div>
      {fr&&fr.length>0&&<p className="mt-2 text-xs font-semibold text-plum line-clamp-2">👥 {fr.map(x=>x.name+" · "+STAT[x.status]).join(", ")}</p>}
      {(s.status==="done"||s.status==="dropped")&&s.review&&<p className="mt-2 text-xs break-words whitespace-pre-line"><b className="text-plum">Review:</b> {s.review}</p>}
      {s.notes&&<p className="mt-2 text-xs italic opacity-70 break-words whitespace-pre-line">“{s.notes}”</p>}</div>
  </article>}

const L=({t,children})=><label className="block"><span className="text-sm font-semibold opacity-70">{t}</span>{children}</label>;
function Auto({value,...p}){const r=useRef();useEffect(()=>{const e=r.current;if(e){e.style.height="auto";e.style.height=e.scrollHeight+2+"px"}},[value]);return <textarea ref={r} value={value} {...p}/>}
function Drawer({item,onClose,onSave,onDelete,onShare,readOnly,fr}){
  const isNew=!item.id;
  const [f,setF]=useState({...blank,...item,genres:(item.genres||[]).join(", "),tags:(item.tags||[]).join(", "),media:(item.media||[]).join("\n")});
  const [q,setQ]=useState(""),[res,setRes]=useState([]),[busy,setBusy]=useState(false);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  useEffect(()=>{if(!isNew||q.length<3)return setRes([]);setBusy(true);
    const t=setTimeout(()=>searchAniList(q).then(setRes).catch(()=>setRes([])).finally(()=>setBusy(false)),400);return()=>clearTimeout(t)},[q]);
  const pick=r=>{setF(p=>({...p,...r,genres:r.genres.join(", ")}));setRes([]);setQ("")};
  const save=()=>{if(!f.title.trim())return alert("Add a title first.");
    onSave({...f,genres:arr(f.genres),tags:arr(f.tags),media:arr(f.media),rating:f.rating===""||f.rating==null?null:Number(f.rating)})};
  const media=arr(f.media),fin=["done","hiatus","dropped"].includes(f.status);
  return <div className="fixed inset-0 z-50 flex justify-end bg-black/50" onClick={onClose}>
    <div className="drawer w-full max-w-xl h-full overflow-y-auto bg-paper dark:bg-night p-6 space-y-4" onClick={e=>e.stopPropagation()}>
      <div className="flex items-center justify-between"><h2 className="text-2xl font-extrabold">{readOnly?f.title:isNew?"Add new series":"Edit series"}</h2><button onClick={onClose} className="text-2xl px-2" aria-label="Close">×</button></div>
      {isNew&&<div className="relative"><input className="inp" placeholder="Search AniList to auto-fill (e.g. Solo Leveling)" value={q} onChange={e=>setQ(e.target.value)}/>
        {(busy||res.length>0)&&<div className="absolute z-10 mt-1 w-full max-h-80 overflow-y-auto rounded-xl bg-white dark:bg-[#221f33] shadow-xl">
          {busy&&<p className="p-3 text-sm opacity-60">Searching…</p>}
          {res.map(r=><button key={r.anilist_id} onClick={()=>pick(r)} className="flex gap-3 w-full text-left p-2 hover:bg-plum/10"><img src={r.cover_url} className="w-10 h-14 object-cover rounded"/><span><b>{r.title}</b><br/><span className="text-xs opacity-60">{r.format} · {r.genres.slice(0,3).join(", ")}</span></span></button>)}</div>}</div>}
      <div className="flex gap-4">{f.cover_url&&<img src={f.cover_url} className="w-28 rounded-xl object-cover aspect-[2/3]"/>}
        <div className="flex-1 space-y-3"><L t="Title"><input className="inp" value={f.title} disabled={readOnly} onChange={e=>set("title",e.target.value)}/></L>
          <L t="Cover image URL"><input className="inp" value={f.cover_url||""} disabled={readOnly} onChange={e=>set("cover_url",e.target.value)}/></L></div></div>
      <div className="flex gap-2 flex-wrap">{FORMATS.map(x=><button key={x} disabled={readOnly} onClick={()=>set("format",x)} className={"rounded-full px-4 py-1.5 text-sm font-bold "+(f.format===x?"bg-plum text-white":"bg-plum/10")}>{x}</button>)}</div>
      <div className="flex gap-2 flex-wrap">{STATUS.map(([k,l])=><button key={k} disabled={readOnly} onClick={()=>set("status",k)} className={"rounded-full px-4 py-1.5 text-sm font-bold "+(f.status===k?"bg-ink text-white dark:bg-white dark:text-ink":"bg-plum/10")}>{l}</button>)}</div>
      <div className="flex items-center justify-between rounded-xl bg-plum/10 p-3"><div><span className="text-sm font-semibold opacity-70">Excitement</span><br/><Stars v={f.excitement} on={readOnly?null:v=>set("excitement",v)}/></div>
        {!readOnly&&<button onClick={()=>set("priority",!f.priority)} className={"rounded-full px-4 py-2 font-bold "+(f.priority?"bg-amber-400 text-black":"bg-white/60 dark:bg-white/10")}>{f.priority?"★ Top pick":"☆ Mark as top pick"}</button>}</div>
      <L t="Series status (is it still being released?)"><select className="inp" value={f.pub_status||""} disabled={readOnly} onChange={e=>set("pub_status",e.target.value)}><option value="">Not set</option>{PUB.map(o=><option key={o}>{o}</option>)}</select></L>
      <L t="Synopsis"><Auto className="inp" rows={4} value={f.synopsis||""} disabled={readOnly} onChange={e=>set("synopsis",e.target.value)}/></L>
      <L t="Genres (comma separated)"><input className="inp" value={f.genres} disabled={readOnly} onChange={e=>set("genres",e.target.value)}/></L>
      <L t="Tropes and tags (e.g. Historical Romance, 90s Romance)"><input className="inp" value={f.tags} disabled={readOnly} onChange={e=>set("tags",e.target.value)}/></L>
      <L t="Content / trigger warnings"><input className="inp" value={f.warnings||""} disabled={readOnly} onChange={e=>set("warnings",e.target.value)}/></L>
      {!readOnly&&<L t="Where did you find it? (TikTok, a friend, Reddit…)"><input className="inp" value={f.source||""} onChange={e=>set("source",e.target.value)}/></L>}
      {!readOnly&&<L t="Moodboard: image or TikTok links, one per line"><textarea className="inp" rows={3} value={f.media} onChange={e=>set("media",e.target.value)}/></L>}
      {media.length>0&&<div className="grid grid-cols-3 gap-2">{media.map(u=>isImg(u)?<a key={u} href={u} target="_blank"><img src={u} className="rounded-lg aspect-square object-cover w-full"/></a>:<a key={u} href={u} target="_blank" className="rounded-lg aspect-square grid place-items-center bg-plum/10 text-sm font-bold p-2 text-center">▶ Open video</a>)}</div>}
      {fr&&fr.length>0&&<div className="rounded-2xl bg-plum/10 p-4 space-y-2"><p className="font-bold">👥 Who else has this</p>{fr.map((x,i)=><div key={i} className="flex items-center gap-3"><Avatar url={x.avatar} name={x.name} size={32}/><span className="font-semibold">{x.name}</span><span className="ml-auto text-sm opacity-80">{STAT[x.status]}{x.rating!=null?" · "+x.rating+"/10":""}</span></div>)}</div>}
      {!readOnly&&<L t="Personal notes / footnotes"><Auto className="inp" rows={3} value={f.notes||""} onChange={e=>set("notes",e.target.value)}/></L>}
      <div className={"rounded-2xl p-4 space-y-3 transition "+(fin?"bg-plum/15 ring-2 ring-plum/40":"opacity-40")}>
        <p className="font-bold">{fin?"Your verdict":"Unlocks when you mark it Completed, Read on Hiatus or Dropped"}</p>
        <L t="Final rating (0–10)"><input type="number" min="0" max="10" step="0.5" className="inp" disabled={readOnly||!fin} value={f.rating??""} onChange={e=>set("rating",e.target.value)}/></L>
        <L t="Review"><Auto className="inp" rows={4} disabled={readOnly||!fin} value={f.review||""} onChange={e=>set("review",e.target.value)}/></L></div>
      {!readOnly&&<div className="flex gap-2 sticky bottom-0 py-3 bg-paper dark:bg-night">
        <button onClick={save} className="flex-1 rounded-xl bg-plum text-white font-bold py-2.5 hover:brightness-110">{isNew?"Add to my list":"Save changes"}</button>
        {!isNew&&<button onClick={()=>onShare(item)} className="rounded-xl bg-plum/15 px-4 font-bold">Share rec</button>}
        {!isNew&&<button onClick={()=>confirm("Delete this series?")&&onDelete(item)} className="rounded-xl bg-rose-500/15 text-rose-500 px-4 font-bold">Delete</button>}</div>}
    </div></div>}

function Filters({f,setF,items}){
  const uniq=k=>[...new Set(items.flatMap(i=>Array.isArray(i[k])?i[k]:[i[k]]).filter(Boolean))].sort();
  const S=({k,label,opts})=><select className="inp sm:!w-auto" value={f[k]} onChange={e=>setF({...f,[k]:e.target.value})}><option value="">{label}</option>{opts.map(o=><option key={o}>{o}</option>)}</select>;
  return <div className="grid grid-cols-2 sm:flex sm:flex-wrap gap-2 sm:items-center">
    <input className="inp col-span-2 sm:!w-48" placeholder="Search my list" value={f.q} onChange={e=>setF({...f,q:e.target.value})}/>
    <S k="format" label="Category" opts={FORMATS}/><S k="tag" label="Trope" opts={uniq("tags")}/><S k="source" label="Source" opts={uniq("source")}/>
    <button onClick={()=>setF({...f,top:!f.top})} className={"rounded-full px-4 py-2 text-sm font-bold "+(f.top?"bg-amber-400 text-black":"bg-plum/10")}>★ Top picks</button></div>}

const emptyF={q:"",format:"",tag:"",source:"",top:false};
const applyF=(items,f)=>items.filter(i=>(!f.q||i.title.toLowerCase().includes(f.q.toLowerCase()))&&(!f.format||i.format===f.format)&&(!f.tag||(i.tags||[]).includes(f.tag))&&(!f.source||i.source===f.source)&&(!f.top||i.priority));

async function readMalFile(file){
  const buf=await file.arrayBuffer(),b=new Uint8Array(buf);
  if(b[0]===0x1f&&b[1]===0x8b)return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return new TextDecoder().decode(buf);
}
function malImport(xml,uid){
  const doc=new DOMParser().parseFromString(xml,"text/xml");
  const map={reading:"reading",completed:"done","plan to read":"want","on-hold":"want",dropped:"want","1":"reading","2":"done","3":"want","4":"want","6":"want"};
  const rows=[...doc.getElementsByTagName("manga")].map((n,i)=>{
    const g=t=>n.getElementsByTagName(t)[0]?.textContent?.trim()||"";const raw=g("my_status").toLowerCase(),st=map[raw]||"want",sc=Number(g("my_score"));
    const held=["on-hold","3"].includes(raw),drop=["dropped","4"].includes(raw);
    return {user_id:uid,title:g("manga_title")||g("series_title"),format:"Manga",status:st,rating:st==="done"&&sc>0?sc:null,notes:g("my_comments")||null,tags:held?["MAL: On-Hold"]:drop?["MAL: Dropped"]:[],position:i}}).filter(r=>r.title);
  return {rows,anime:doc.getElementsByTagName("anime").length};
}

function FriendsPanel({me,rows,prof,onClose,onAct,onAdd,onLink}){
  const [txt,setTxt]=useState("");
  const other=r=>r.requester===me?r.addressee:r.requester,nm=r=>prof[other(r)]?.display_name||"Someone";
  const inc=rows.filter(r=>r.status==="pending"&&r.addressee===me),out=rows.filter(r=>r.status==="pending"&&r.requester===me),fr=rows.filter(r=>r.status==="accepted");
  const Row=({r,children})=><div className="flex items-center gap-3"><Avatar url={prof[other(r)]?.avatar_url} name={nm(r)} size={40}/><a href={"#/share/"+other(r)} className="font-bold flex-1 truncate hover:underline">{nm(r)}</a>{children}</div>;
  const B=({onClick,children,cls})=><button onClick={onClick} className={"rounded-full px-3 py-1 text-sm font-bold "+(cls||"bg-plum/15")}>{children}</button>;
  return <div className="fixed inset-0 z-50 flex justify-end bg-black/40" onClick={onClose}><div className="drawer w-full max-w-sm h-full bg-paper p-6 space-y-5 overflow-y-auto" onClick={e=>e.stopPropagation()}>
    <div className="flex justify-between items-center"><h2 className="text-2xl font-extrabold">Friends</h2><button onClick={onClose} className="text-2xl px-2" aria-label="Close">×</button></div>
    {inc.length>0&&<div className="space-y-2"><p className="font-semibold">Friend requests</p>{inc.map(r=><Row key={r.id} r={r}><B onClick={()=>onAct("accept",r)} cls="bg-plum text-white">Accept</B><B onClick={()=>onAct("remove",r)}>Decline</B></Row>)}</div>}
    <div className="space-y-2"><p className="font-semibold">My friends ({fr.length})</p>{fr.length===0&&<p className="text-sm opacity-60">No friends yet. Send your link, or paste theirs below.</p>}{fr.map(r=><Row key={r.id} r={r}><B onClick={()=>confirm("Remove this friend?")&&onAct("remove",r)}>Remove</B></Row>)}</div>
    {out.length>0&&<div className="space-y-2"><p className="font-semibold">Sent requests</p>{out.map(r=><Row key={r.id} r={r}><B onClick={()=>onAct("remove",r)}>Cancel</B></Row>)}</div>}
    <div className="space-y-2"><p className="font-semibold">Add a friend</p><input className="inp" placeholder="Paste their share link" value={txt} onChange={e=>setTxt(e.target.value)}/>
      <button onClick={()=>{onAdd(txt);setTxt("")}} className="w-full rounded-xl bg-plum text-white font-bold py-2">Send friend request</button>
      <button onClick={onLink} className="w-full rounded-xl bg-plum/15 font-bold py-2">Copy my link to send to friends</button></div></div></div>}

function Tracker({user,dark,setDark,th}){
  const [items,setItems]=useState([]),[tab,setTab]=useState("reading"),[f,setF]=useState(emptyF),[open,setOpen]=useState(null),[toast,setToast]=useState(""),[panel,setPanel]=useState(false),[prof,setProf]=useState({}),[pp,setPP]=useState(false),[frs,setFrs]=useState([]),[fp,setFp]=useState({}),[fs,setFs]=useState([]),[fpanel,setFpanel]=useState(false);
  const dragIdx=useRef(null),fileRef=useRef();
  const load=async()=>{const {data}=await sb.from("series").select("*").eq("user_id",user.id).order("position");setItems(data||[])};
  useEffect(()=>{load();const ch=sb.channel("series-"+user.id).on("postgres_changes",{event:"*",schema:"public",table:"series",filter:"user_id=eq."+user.id},load).subscribe();return()=>sb.removeChannel(ch)},[]);
  useEffect(()=>{sb.from("profiles").select("*").eq("user_id",user.id).maybeSingle().then(({data})=>setProf(data||{}))},[]);
  const say=m=>{setToast(m);setTimeout(()=>setToast(""),2500)};
  const save=async s=>{const {id,created_at,user_id,...rest}=s;
    const r=id?await sb.from("series").update(rest).eq("id",id):await sb.from("series").insert({...rest,position:Math.max(-1,...items.map(i=>i.position))+1});
    if(r.error)return alert(r.error.message);setOpen(null);load();say(id?"Saved":"Added")};
  const saveProf=async p=>{const {error}=await sb.from("profiles").upsert({user_id:user.id,...p});if(error)return alert(error.message);setProf(x=>({...x,...p}));setPP(false);say("Profile saved")};
  const del=async s=>{await sb.from("series").delete().eq("id",s.id);setOpen(null);load()};
  const loadFriends=async()=>{const {data}=await sb.from("friendships").select("*");const rows=data||[];setFrs(rows);
    const oth=r=>r.requester===user.id?r.addressee:r.requester,ids=rows.map(oth),acc=rows.filter(r=>r.status==="accepted").map(oth);
    if(!ids.length){setFp({});setFs([]);return}
    const [a,b]=await Promise.all([sb.from("profiles").select("*").in("user_id",ids),acc.length?sb.from("series").select("*").in("user_id",acc):{data:[]}]);
    setFp(Object.fromEntries((a.data||[]).map(x=>[x.user_id,x])));setFs(b.data||[])};
  useEffect(()=>{loadFriends();const ch=sb.channel("fr-"+user.id).on("postgres_changes",{event:"*",schema:"public",table:"friendships"},loadFriends).subscribe();return()=>sb.removeChannel(ch)},[]);
  const friendHas=x=>fs.filter(y=>same(x,y)).map(y=>({name:fp[y.user_id]?.display_name||"A friend",avatar:fp[y.user_id]?.avatar_url,status:y.status,rating:y.rating}));
  const incoming=frs.filter(r=>r.status==="pending"&&r.addressee===user.id).length;
  const fAct=async(a,r)=>{const {error}=await (a==="accept"?sb.from("friendships").update({status:"accepted"}).eq("id",r.id):sb.from("friendships").delete().eq("id",r.id));if(error)alert(error.message);loadFriends()};
  const fAdd=async txt=>{const m=txt.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);if(!m)return alert("That does not look like a share link.");
    const uid=m[0].toLowerCase();if(uid===user.id)return alert("That is your own link.");
    const {error}=await addFriend(user.id,uid,frs);if(error)return alert(error.message);say("Friend request sent");loadFriends()};
  const link=async id=>{await sb.from("profiles").upsert({user_id:user.id,is_public:true});
    const url=location.href.split("#")[0]+"#/share/"+user.id+(id?"/"+id:"");await navigator.clipboard.writeText(url).catch(()=>prompt("Copy this link",url));say("Link copied")};
  const visible=useMemo(()=>applyF(items.filter(i=>tab==="active"?i.status!=="done":i.status===tab),f),[items,tab,f]);
  const canDrag=f===emptyF||JSON.stringify(f)===JSON.stringify(emptyF);
  const drop=async to=>{const from=dragIdx.current;if(from==null||from===to)return;
    const list=[...visible];const [m]=list.splice(from,1);list.splice(to,0,m);
    const pos=list.map((x,i)=>({id:x.id,position:i}));setItems(p=>p.map(x=>({...x,position:pos.find(y=>y.id===x.id)?.position??x.position})).sort((a,b)=>a.position-b.position));
    await Promise.all(pos.map(p=>sb.from("series").update({position:p.position}).eq("id",p.id)));load()};
  const onFile=async e=>{const file=e.target.files[0];e.target.value="";if(!file)return;
    let xml;try{xml=await readMalFile(file)}catch(err){return alert("Could not read that file. Try unzipping it first and choosing the .xml file inside.")}
    const {rows,anime}=malImport(xml,user.id);
    if(!rows.length)return alert(anime?"That looks like your anime list. Please choose your manga list file instead (it has manga in its name).":"No manga entries found. Make sure you chose the manga list export from MyAnimeList.");
    const {error}=await sb.from("series").insert(rows.map((r,i)=>({...r,position:items.length+i})));
    error?alert(error.message):(say("Imported "+rows.length+" titles"),load())};
  return <div className="max-w-7xl mx-auto p-4 md:p-8 space-y-6">
    <header className="flex flex-col sm:flex-row items-center gap-4 justify-between"><div className="flex items-center gap-3"><Logo size={48}/><h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight">Manhwa Tracker</h1></div>
      <div className="flex gap-2 flex-wrap justify-center sm:justify-end items-center">
        <button onClick={()=>setOpen({...blank,status:tab==="active"?"want":tab})} className="rounded-full bg-plum text-white font-bold px-5 py-2 hover:brightness-110">+ Add series</button>
        <button onClick={()=>link()} className="rounded-full bg-plum/15 font-bold px-4 py-2">Share my list</button>
        
        
                <button onClick={()=>setFpanel(true)} className="rounded-full bg-plum/15 font-bold px-4 py-2">👥 Friends{incoming>0&&<span className="ml-1.5 rounded-full bg-rose-500 text-white text-xs px-1.5 py-0.5">{incoming}</span>}</button>
        <button onClick={()=>setPanel(true)} className="rounded-full bg-plum/15 font-bold px-4 py-2">🎨 Theme</button>
        <button onClick={()=>sb.auth.signOut()} className="rounded-full px-3 py-2 text-sm opacity-70 underline">Sign out</button>
        <button onClick={()=>setPP(true)} className="rounded-full ring-2 ring-plum/40 hover:ring-plum transition" aria-label="My profile"><Avatar url={prof.avatar_url} name={prof.display_name||user.email} size={40}/></button></div></header>
    <nav className="flex gap-2 flex-wrap justify-center sm:justify-start">{TABS.map(([k,l])=><button key={k} onClick={()=>setTab(k)} className={"rounded-full px-3 sm:px-5 py-1.5 sm:py-2 text-sm sm:text-base font-bold transition "+(k==="dropped"?"sm:ml-auto ":"")+(tab===k?"bg-ink text-white dark:bg-white dark:text-ink":"bg-plum/10")}>{l} <span className="opacity-60">{items.filter(i=>k==="active"?i.status!=="done":i.status===k).length}</span></button>)}</nav>
    <Filters f={f} setF={setF} items={items}/>
    {tab!=="done"&&canDrag&&visible.length>1&&<p className="text-sm opacity-60 text-center sm:text-left">Drag cards to set your reading order. It saves automatically.</p>}
    {visible.length===0?<div className="text-center py-24 opacity-70"><p className="text-xl font-bold">Nothing here yet</p><p>Add a series or change your filters.</p></div>:
    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-4">
      {visible.map((s,i)=><Card key={s.id} s={s} fr={friendHas(s)} onOpen={setOpen} drag={canDrag?{onDragStart:()=>dragIdx.current=i,onDragOver:e=>e.preventDefault(),onDrop:()=>drop(i)}:null}/>)}</div>}
    {open&&<Drawer item={open} fr={open.id?friendHas(open):[]} onClose={()=>setOpen(null)} onSave={save} onDelete={del} onShare={s=>link(s.id)}/>}
    {pp&&<ProfilePanel user={user} prof={prof} items={items} onSave={saveProf} onClose={()=>setPP(false)}/>}
    {fpanel&&<FriendsPanel me={user.id} rows={frs} prof={fp} onClose={()=>setFpanel(false)} onAct={fAct} onAdd={fAdd} onLink={()=>link()}/>}
    {panel&&<ThemePanel th={th} dark={dark} setDark={setDark} onClose={()=>setPanel(false)}/>}
    {toast&&<div className="fixed bottom-6 left-1/2 -translate-x-1/2 rounded-full bg-ink text-white px-5 py-2 pop">{toast}</div>}
  </div>}

function Shared({uid,sid,dark,setDark,me}){
  const [items,setItems]=useState(null),[open,setOpen]=useState(null),[who,setWho]=useState({}),[rows,setRows]=useState([]),[mine,setMine]=useState([]);
  const loadAll=()=>{sb.from("profiles").select("display_name,avatar_url,bio").eq("user_id",uid).maybeSingle().then(({data})=>setWho(data||{}));let q=sb.from("series").select("*").eq("user_id",uid).order("position");if(sid)q=q.eq("id",sid);q.then(({data})=>setItems(data||[]))};
  const loadRel=async()=>{if(!me)return;const [a,b]=await Promise.all([sb.from("friendships").select("*"),sb.from("series").select("*").eq("user_id",me.id)]);setRows(a.data||[]);setMine(b.data||[])};
  useEffect(()=>{loadAll();loadRel()},[me?.id]);
  const clean=s=>({...s,notes:null,source:null,media:[]});
  const rel=me?relWith(rows,me.id,uid):null;
  const doAdd=async()=>{const {error}=await addFriend(me.id,uid,rows);if(error)return alert(error.message);await loadRel();loadAll()};
  const youHave=x=>me&&me.id!==uid?mine.filter(y=>same(x,y)).map(y=>({name:"You",status:y.status,rating:y.rating})):[];
  const pill="rounded-full bg-plum/15 font-bold px-4 py-2";
  const friendBtn=me===undefined||me?.id===uid?null:!me?<a href={location.href.split("#")[0]} className={pill}>Sign in to add friend</a>:rel?.status==="accepted"?<span className={pill}>✓ Friends</span>:rel?.dir==="out"?<span className={pill}>Request sent</span>:<button onClick={doAdd} className="rounded-full bg-plum text-white font-bold px-5 py-2 hover:brightness-110">{rel?"Accept friend request":"+ Add friend"}</button>;
  return <div className="max-w-7xl mx-auto p-4 md:p-8 space-y-6">
    <header className="flex flex-col sm:flex-row gap-4 justify-between items-center text-center sm:text-left"><div className="flex flex-col sm:flex-row items-center gap-3"><Avatar url={who.avatar_url} name={who.display_name} size={56}/><div><h1 className="text-2xl sm:text-3xl font-extrabold">{sid?"A recommendation from "+(who.display_name||"a friend"):who.display_name?who.display_name+"’s reading list":"A reading list to browse"}</h1>{who.bio&&<p className="opacity-70">{who.bio}</p>}</div></div><div className="flex gap-2 items-center flex-wrap justify-center">{me&&<a href="#/" className={pill}>← My list</a>}{friendBtn}<button onClick={()=>setDark(!dark)} className="rounded-full bg-plum/15 px-4 py-2">{dark?"☀":"☾"}</button></div></header>
    {items===null?<p>Loading…</p>:items.length===0?<p className="opacity-70">This list is private or empty.</p>:
    STATUS.map(([k,l])=>{const g=items.filter(i=>i.status===k);return g.length>0&&<section key={k}><h2 className="text-xl font-bold mb-3">{l}</h2>
      <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 sm:gap-4">{g.map(s=><Card key={s.id} s={s} readOnly fr={youHave(s)} onOpen={x=>setOpen(clean(x))}/>)}</div></section>})}
    {open&&<Drawer item={open} readOnly fr={youHave(open)} onClose={()=>setOpen(null)}/>}
    <p className="text-sm opacity-60"><a className="underline" href={location.href.split("#")[0]}>Make your own list</a></p></div>}

function App(){
  const [dark,setDark]=useState(()=>{try{return localStorage.getItem("pt-dark")?localStorage.getItem("pt-dark")==="1":matchMedia("(prefers-color-scheme: dark)").matches}catch(e){return false}});
  useEffect(()=>{document.documentElement.classList.toggle("dark",dark);try{localStorage.setItem("pt-dark",dark?"1":"0")}catch(e){}},[dark]);
  const [hash,setHash]=useState(location.hash),[session,setSession]=useState(undefined);
  const [t,setT]=useState(()=>{try{return JSON.parse(localStorage.getItem("mt-theme"))||{preset:"Lavender",grad:true}}catch(e){return {preset:"Lavender",grad:true}}});
  useEffect(()=>{applyTheme(t,dark);try{localStorage.setItem("mt-theme",JSON.stringify(t))}catch(e){}},[t,dark]);
  useEffect(()=>{const h=()=>setHash(location.hash);addEventListener("hashchange",h);return()=>removeEventListener("hashchange",h)},[]);
  useEffect(()=>{if(!sb)return;sb.auth.getSession().then(({data})=>setSession(data.session));const {data}=sb.auth.onAuthStateChange((_e,s)=>setSession(s));return()=>data.subscription.unsubscribe()},[]);
  if(!configured)return <Setup/>;
  const m=hash.match(/^#\/share\/([\w-]+)(?:\/([\w-]+))?/);
  if(m)return <Shared uid={m[1]} sid={m[2]} dark={dark} setDark={setDark} me={session===undefined?undefined:(session?.user||null)}/>;
  if(session===undefined)return null;
  return session?<Tracker user={session.user} dark={dark} setDark={setDark} th={{t,setT}}/>:<Auth/>;
}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
